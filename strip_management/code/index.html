<body>

  <div class="main">
    <div class="container single-column">
      <div class="header header-mixed" draggable="false">
        <div class="header-block dep">
          <div>
            <p>departure</p>
            <button type="button" onclick="addStrip('takeoffStripContainer')">
              add strip
            </button>
          </div>
          <p class="hidden-count" id="takeoffHiddenCount">
            非表示ストリップ: 枚
          </p>
        </div>
      </div>

      <!-- ★ここに混在表示 -->
      <div id="takeoffStripContainer" class="stripContainer"></div>
    </div>
    <div class="container single-column">
      <div class="header header-mixed" draggable="false">
        <div class="header-block arr">
          <div>
            <p>arrive</p>
            <button type="button" onclick="addStrip('landingStripContainer')" id="addArrivalStripButton">
              add strip
            </button>
          </div>
          <p class="hidden-count" id="landingHiddenCount">
            非表示ストリップ: 枚
          </p>
        </div>
      </div>

      <!-- ★中央の置き場 -->
      <div id="landingStripContainer" class="stripContainer"></div>
    </div>

    <!-- 右：上 Wind / 下 発出済 -->
    <div class="container single-column right-column">
      <!-- Wind -->
      <div class="header header-mixed" draggable="false">
        <p style="color: white; margin: 0">Wind</p>
      </div>

      <div class="wind-panel">
        <div class="wind-stack">
          <div class="wind-item">
            <div class="wind-label">DIR</div>
            <div class="wind-ring">
              <input id="windDir" type="number" value="270" min="0" max="360" />
            </div>
          </div>

          <div class="wind-item">
            <div class="wind-label">SPD</div>
            <div class="wind-ring">
              <input id="windSpd" type="number" value="12" min="0" max="99" />
            </div>
          </div>
        </div>
      </div>

      <!-- 発出済 -->
      <div class="header header-mixed" draggable="false">
        <p style="color: white; margin: 0">発出済エリア</p>
      </div>

      <!-- 既存IDをそのまま発出済の箱に使う -->
      <div id="stripContainerMid" class="stripContainer"></div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>

</html>
